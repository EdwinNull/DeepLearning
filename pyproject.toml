[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minitorch"
version = "0.1.0"
description = "从零手写的微型深度学习框架（教学用），API 刻意贴近 PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# minitorch 框架本身只依赖 numpy。
# torch / matplotlib 等仅用于 notebook 中的「对照」与可视化，作为可选附加项。
dependencies = [
    "numpy>=1.26,<2.1",
]

[project.optional-dependencies]
compare = ["torch>=2.2,<2.6", "torchvision>=0.17"]
viz = ["matplotlib>=3.8", "graphviz"]
dev = ["pytest>=8.0", "jupyterlab>=4.0", "ipykernel", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["."]
include = ["minitorch*"]
